<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPL Match Winner Prediction</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body class="bg-light">

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-8">

            <div class="card shadow">

                <div class="card-header text-center">
                    <h2>IPL Match Winner Prediction</h2>
                    <p class="text-muted mb-0">
                        Predict the outcome of an IPL match using historical statistics
                    </p>
                </div>

                <div class="card-body">

                    <form action="/predict" method="POST">

                        <!-- Team 1 -->
                        <div class="mb-3">
                            <label class="form-label">Team 1</label>

                            <select class="form-select"
                                    name="team1"
                                    required>

                                {% for team in teams %}
                                    <option value="{{ team }}">
                                        {{ team }}
                                    </option>
                                {% endfor %}

                            </select>
                        </div>

                        <!-- Team 2 -->
                        <div class="mb-3">
                            <label class="form-label">Team 2</label>

                            <select class="form-select"
                                    name="team2"
                                    required>

                                {% for team in teams %}
                                    <option value="{{ team }}">
                                        {{ team }}
                                    </option>
                                {% endfor %}

                            </select>
                        </div>

                        <!-- Venue -->
                        <div class="mb-3">
                            <label class="form-label">Venue</label>

                            <select class="form-select"
                                    name="venue"
                                    required>

                                {% for venue in venues %}
                                    <option value="{{ venue }}">
                                        {{ venue }}
                                    </option>
                                {% endfor %}

                            </select>
                        </div>

                        <!-- Toss Winner -->
                        <div class="mb-3">
                            <label class="form-label">Toss Winner</label>

                            <select class="form-select"
                                    name="toss_winner"
                                    required>

                                {% for team in teams %}
                                    <option value="{{ team }}">
                                        {{ team }}
                                    </option>
                                {% endfor %}

                            </select>
                        </div>

                        <!-- Toss Decision -->
                        <div class="mb-3">

                            <label class="form-label">
                                Toss Decision
                            </label>

                            <select class="form-select"
                                    name="toss_decision">

                                <option value="bat">Bat</option>
                                <option value="field">Field</option>

                            </select>

                        </div>

                        <hr>

                        <!-- First Innings -->

                        <div class="form-check mb-3">

                            <input class="form-check-input"
                                   type="checkbox"
                                   id="scoreCheck">

                            <label class="form-check-label"
                                   for="scoreCheck">

                                First innings completed

                            </label>

                        </div>

                        <!-- Team 1 Score -->

                        <div class="mb-4">

                            <label class="form-label">
                                Team 1 Score
                            </label>

                            <input
                                type="number"
                                class="form-control"
                                name="team1_score"
                                id="team1Score"
                                placeholder="Leave empty for pre-match prediction"
                                disabled>

                        </div>

                        <!-- Submit -->

                        <div class="d-grid">

                            <button
                                class="btn btn-primary btn-lg"
                                type="submit">

                                Predict Winner

                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

<script>

const checkbox = document.getElementById("scoreCheck");
const scoreInput = document.getElementById("team1Score");

checkbox.addEventListener("change", function(){

    scoreInput.disabled = !this.checked;

    if(!this.checked){
        scoreInput.value = "";
    }

});

</script>

</body>
</html>
